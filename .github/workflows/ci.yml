name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only reads the repository; say so rather than inheriting more.
permissions:
  contents: read

# A new push makes the run already in progress pointless, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins and fails if the
      # lockfile and package.json disagree — which `npm install` would quietly
      # paper over by rewriting the lockfile.
      - name: Install dependencies
        id: install
        run: npm ci

      - name: Lint
        run: npm run lint

      # The checks below run even when an earlier one failed, so a formatting
      # slip does not hide the test results. They are still skipped when the
      # install failed, because then every one of them would fail for the same
      # uninformative reason.
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test

      # Runs `tsc -b` before Vite, so this is the type check as well.
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
